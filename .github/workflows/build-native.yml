name: Build Puke Amp VST3

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: VST3 (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            artifact_name: Puke-Amp-VST3-macOS
            artifact_path: NeuralAmpModeler/build-vst3/mac/Puke Amp-VST3-macOS.zip
          - platform: Windows
            os: windows-latest
            artifact_name: Puke-Amp-VST3-Windows
            artifact_path: NeuralAmpModeler/build-vst3/windows/Puke Amp-VST3-Windows*

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download VST3 SDK
        shell: bash
        working-directory: iPlug2/Dependencies/IPlug
        run: ./download-iplug-sdks.sh

      - name: Download iPlug2 prebuilt libraries
        shell: bash
        working-directory: iPlug2/Dependencies
        run: ./download-prebuilt-libs.sh

      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not installed at $iscc"
          }

      - name: Build macOS VST3
        if: runner.os == 'macOS'
        shell: bash
        run: NeuralAmpModeler/scripts/make-vst3-mac.sh

      - name: Build Windows VST3
        if: runner.os == 'Windows'
        shell: cmd
        run: NeuralAmpModeler\scripts\make-vst3-win.bat

      - name: Upload packaged VST3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
